server.port=9090

spring.datasource.url=jdbc:postgresql://localhost:5432/shareit
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=password

spring.jpa.hibernate.ddl-auto=none
spring.jpa.generate-ddl=false

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC


logging.level.ru.practicum.shareit=DEBUG

# Hibernate SQL logging with parameters
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Spring Data JPA logging
logging.level.org.springframework.data.jpa=DEBUG
logging.level.org.springframework.transaction=TRACE

# JDBC connection logging
logging.level.org.springframework.jdbc=DEBUG
logging.level.org.springframework.jdbc.core=TRACE

# Web layer logging
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG

# Logging exceptions
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.dao=DEBUG
logging.level.org.hibernate.exception=DEBUG

# Logging exceptions at controllers
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=DEBUG
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestResponseBodyMethodProcessor=DEBUG