version: '3.8'
services:
  db:
    image: postgres:13
    container_name: shareit-db
    environment:
      POSTGRES_DB: shareit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - shareit-network

  server:
    build: 
      context: ./server
      dockerfile: Dockerfile
    container_name: shareit-server
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/shareit
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SERVER_PORT: 9090
    depends_on:
      - db
    networks:
      - shareit-network

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: shareit-gateway
    ports:
      - "8080:8080"
    depends_on:
      - server
    networks:
      - shareit-network

networks:
  shareit-network:
    driver: bridge

volumes:
  postgres_data: